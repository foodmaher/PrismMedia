name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-2022

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        shell: pwsh
        run: >
          msbuild PrismTextureStreamerFB.sln
          /m
          /restore
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64

      - name: Verify plugin output
        shell: pwsh
        run: |
          $Dll = "x64\Release\PrismTextureStreamerFB.dll"
          if (-not (Test-Path $Dll)) {
              throw "Expected DLL was not produced: $Dll"
          }

          Get-Item $Dll
          Get-FileHash -Algorithm SHA256 $Dll

      - name: Assemble install package
        shell: pwsh
        run: |
          $Package = "package"
          $Client = "PrismMediaClient\bin\x64\Release\net48"
          if (-not (Test-Path "$Client\PrismMediaClient.exe")) {
              throw "PrismMediaClient.exe was not produced in $Client"
          }

          New-Item -ItemType Directory -Path $Package -Force | Out-Null
          Copy-Item "x64\Release\PrismTextureStreamerFB.dll" $Package
          Copy-Item "$Client\*" $Package -Recurse
          Copy-Item "PERFORMANCE-NOTES.md" $Package
          Copy-Item "V2.1-ADAPTIVE-TESTING.md" $Package

          @"
          PrismTextureStreamerFB 2.1.0

          Copy every file and folder in this package into:
          <ETS2 or ATS>\bin\win_x64\plugins

          Keep PrismMediaClient.exe and its DLL/files beside
          PrismTextureStreamerFB.dll. Open the menu with Ctrl+F8.
          "@ | Set-Content "$Package\INSTALL.txt"

          Get-ChildItem $Package -Recurse

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: PrismTextureStreamerFB-2.1.0-adaptive
          path: package
          if-no-files-found: error
          retention-days: 30
