<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prism Media Client</title>
  <style>
    html,body,#youtube,#direct{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#000}
    #direct{display:none;object-fit:contain}
    #status{position:fixed;left:16px;bottom:12px;z-index:5;color:#dcecf2;background:#07121dcc;padding:7px 10px;border:1px solid #1a596c;border-radius:7px;font:13px "Segoe UI",sans-serif}
    #brightness-overlay{position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="youtube"></div>
  <video id="direct" playsinline></video>
  <div id="status">Paste a YouTube video or playlist URL in the in-game menu.</div>
  <div id="brightness-overlay"></div>
  <script>
    "use strict";
    let player = null, ready = false, pendingUrl = "", source = "youtube";
    let activePlaylist = "", playlistRefreshSerial = 0;
    let playlistRefreshInProgress = false;
    let queuedPlaylistStep = 0;
    let wantsPlayback = true, vehiclePowered = true, mediaFrozen = false;
    let brightness = 1;
    const direct = document.getElementById("direct");
    const status = document.getElementById("status");
    const overlay = document.getElementById("brightness-overlay");

    function log(category, message) {
      try { window.chrome?.webview?.postMessage("log|" + category + "|" + message); }
      catch (_) {}
    }
    function showStatus(text) {
      status.textContent = text;
      status.style.display = text ? "block" : "none";
    }
    function shouldPlay() {
      return wantsPlayback && vehiclePowered && !mediaFrozen;
    }
    function publishTransport(playing) {
      try { window.chrome?.webview?.postMessage("transport|" + (playing ? "1" : "0")); }
      catch (_) {}
    }
    function showOnly(next) {
      source = next;
      document.getElementById("youtube").style.display = next === "youtube" ? "block" : "none";
      direct.style.display = next === "direct" ? "block" : "none";
    }
    function applyBrightness(value) {
      brightness = Math.max(.05, Math.min(2, Number(value) || 1));
      const filter = brightness > 1 ? "brightness(" + brightness.toFixed(4) + ")" : "none";
      document.getElementById("youtube").style.filter = filter;
      direct.style.filter = filter;
      overlay.style.opacity = brightness < 1 ? (1 - brightness).toFixed(4) : "0";
    }
    function youtubeInfo(value) {
      try {
        const url = new URL(value), host = url.hostname.replace(/^www\./, "");
        if (host === "youtu.be")
          return { video: url.pathname.slice(1), list: url.searchParams.get("list") };
        if (["youtube.com", "m.youtube.com", "music.youtube.com"].includes(host)) {
          let video = url.searchParams.get("v");
          const parts = url.pathname.split("/").filter(Boolean);
          if (!video && ["embed", "shorts"].includes(parts[0])) video = parts[1];
          return { video, list: url.searchParams.get("list") };
        }
      } catch (_) {}
      return null;
    }
    function applyPlayback() {
      if (source === "youtube" && ready && player) {
        const state = player.getPlayerState();
        if (shouldPlay()) {
          if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING)
            player.playVideo();
        } else if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
          player.pauseVideo();
        }
      } else if (source === "direct" && direct.src) {
        if (shouldPlay()) direct.play().catch(error => showStatus("Unable to play media: " + error.message));
        else direct.pause();
      }
    }
    function refreshPlaylist(step, reason, explicitCommand) {
      if (!ready || !player) return;
      if (explicitCommand) wantsPlayback = true;
      if (!activePlaylist) {
        if (step < 0) player.previousVideo(); else player.nextVideo();
        window.setTimeout(applyPlayback, 80);
        return;
      }
      if (playlistRefreshInProgress) {
        queuedPlaylistStep += step;
        return;
      }
      const queue = player.getPlaylist ? player.getPlaylist() : null;
      const count = queue && queue.length ? queue.length : 0;
      const current = Math.max(0, Number(player.getPlaylistIndex()) || 0);
      const target = count > 0 ? (current + step + count) % count : Math.max(0, current + step);
      const serial = ++playlistRefreshSerial;
      playlistRefreshInProgress = true;
      showStatus(reason || "Refreshing YouTube playlist…");
      log("playlist", "Refreshing queue at index " + target + ".");
      const options = { list: activePlaylist, listType: "playlist", index: target, startSeconds: 0 };
      if (shouldPlay()) player.loadPlaylist(options); else player.cuePlaylist(options);
      window.setTimeout(function () {
        if (serial !== playlistRefreshSerial) return;
        playlistRefreshInProgress = false;
        showStatus("");
        applyPlayback();
        if (queuedPlaylistStep !== 0) {
          const queuedStep = queuedPlaylistStep;
          queuedPlaylistStep = 0;
          refreshPlaylist(queuedStep,
            queuedStep > 0 ? "Loading the next playlist track…" :
              "Loading the previous playlist track…", true);
        }
      }, 700);
    }
    function loadMedia(value) {
      ++playlistRefreshSerial;
      playlistRefreshInProgress = false;
      queuedPlaylistStep = 0;
      wantsPlayback = true;
      const info = youtubeInfo(value);
      if (info) {
        direct.pause();
        showOnly("youtube");
        if (!ready) { pendingUrl = value; showStatus("Loading YouTube player…"); return; }
        if (info.list) {
          activePlaylist = info.list;
          const options = { list: activePlaylist, listType: "playlist" };
          if (shouldPlay()) player.loadPlaylist(options); else player.cuePlaylist(options);
          log("media", "Loaded YouTube playlist URL.");
        } else if (info.video) {
          activePlaylist = "";
          if (shouldPlay()) player.loadVideoById(info.video); else player.cueVideoById(info.video);
          log("media", "Loaded YouTube video URL.");
        } else { activePlaylist = ""; showStatus("This YouTube URL has no video or playlist."); return; }
        showStatus("");
        applyPlayback();
        return;
      }
      if (ready && player) player.pauseVideo();
      activePlaylist = "";
      showOnly("direct");
      direct.src = value;
      showStatus("");
      applyPlayback();
      log("media", "Loaded direct/local media.");
    }
    function seekDirect(step) {
      direct.currentTime = Math.max(0, Math.min(direct.duration || Infinity, direct.currentTime + step * 30));
      wantsPlayback = true;
      applyPlayback();
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("youtube", {
        width: "100%", height: "100%",
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, enablejsapi: 1, playsinline: 1, rel: 0 },
        events: {
          onReady: function () {
            ready = true;
            applyBrightness(brightness);
            if (pendingUrl) { const value = pendingUrl; pendingUrl = ""; loadMedia(value); }
            applyPlayback();
          },
          onStateChange: function (event) {
            if (vehiclePowered && !mediaFrozen && !playlistRefreshInProgress) {
              if (event.data === YT.PlayerState.PLAYING) wantsPlayback = true;
              else if (event.data === YT.PlayerState.PAUSED) wantsPlayback = false;
            }
            if (!shouldPlay() && (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING))
              player.pauseVideo();
            else if (event.data === YT.PlayerState.ENDED && activePlaylist && !playlistRefreshInProgress)
              refreshPlaylist(1, "Loading the next playlist track…", false);
            if (event.data === YT.PlayerState.PLAYING) publishTransport(true);
            else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED)
              publishTransport(false);
          },
          onError: function (event) {
            log("error", "YouTube playback error " + event.data);
            showStatus("YouTube playback error " + event.data);
          }
        }
      });
    };
    direct.addEventListener("play", function () {
      if (vehiclePowered && !mediaFrozen) wantsPlayback = true;
      publishTransport(true);
    });
    direct.addEventListener("pause", function () {
      if (vehiclePowered && !mediaFrozen) wantsPlayback = false;
      publishTransport(false);
    });
    window.prismCommand = function (payload) {
      const separator = payload.indexOf("|");
      const command = separator < 0 ? payload : payload.slice(0, separator);
      const argument = separator < 0 ? "" : payload.slice(separator + 1);
      if (command === "load") loadMedia(argument);
      else if (command === "playpause") { wantsPlayback = !wantsPlayback; applyPlayback(); }
      else if (command === "play") { wantsPlayback = true; applyPlayback(); }
      else if (command === "pause") { wantsPlayback = false; applyPlayback(); }
      else if (command === "vehiclepower") { vehiclePowered = argument === "1"; applyPlayback(); }
      else if (command === "freeze") { mediaFrozen = argument === "1"; applyPlayback(); }
      else if (command === "brightness") applyBrightness(argument);
      else if (command === "next") {
        if (source === "youtube") refreshPlaylist(1, "Loading the next playlist track…", true);
        else seekDirect(1);
      } else if (command === "previous") {
        if (source === "youtube") refreshPlaylist(-1, "Loading the previous playlist track…", true);
        else seekDirect(-1);
      } else if (command === "mute") {
        if (source === "youtube" && ready) { if (player.isMuted()) player.unMute(); else player.mute(); }
        else direct.muted = !direct.muted;
      } else if (command === "volumeup" || command === "volumedown") {
        const change = command === "volumeup" ? 5 : -5;
        if (source === "youtube" && ready)
          player.setVolume(Math.max(0, Math.min(100, player.getVolume() + change)));
        else direct.volume = Math.max(0, Math.min(1, direct.volume + change / 100));
      }
    };
    const api = document.createElement("script");
    api.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(api);
  </script>
</body>
</html>
