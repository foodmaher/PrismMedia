<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prism Media Client</title>
  <style>
    html,body,#youtube,#direct{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#000}
    #direct{display:none;object-fit:contain}
    #status{position:fixed;left:16px;bottom:12px;z-index:5;color:#dcecf2;background:#07121dcc;padding:7px 10px;border:1px solid #1a596c;border-radius:7px;font:13px "Segoe UI",sans-serif}
    #brightness-overlay{position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="youtube"></div>
  <video id="direct" playsinline></video>
  <div id="status">Paste a YouTube video or playlist URL in the in-game menu.</div>
  <div id="brightness-overlay"></div>
  <script>
    "use strict";
    let player=null,ready=false,pendingUrl="",source="youtube",playlist="";
    let wantsPlayback=true,vehiclePowered=true,mediaFrozen=false,brightness=1;
    const direct=document.getElementById("direct");
    const status=document.getElementById("status");
    const overlay=document.getElementById("brightness-overlay");

    function log(category,message){try{window.chrome?.webview?.postMessage("log|"+category+"|"+message)}catch(_){}}
    function showStatus(text){status.textContent=text;status.style.display=text?"block":"none"}
    function shouldPlay(){return wantsPlayback&&vehiclePowered&&!mediaFrozen}
    function showOnly(next){source=next;document.getElementById("youtube").style.display=next==="youtube"?"block":"none";direct.style.display=next==="direct"?"block":"none"}
    function applyBrightness(value){brightness=Math.max(.05,Math.min(2,Number(value)||1));const filter=brightness>1?"brightness("+brightness.toFixed(4)+")":"none";document.getElementById("youtube").style.filter=filter;direct.style.filter=filter;overlay.style.opacity=brightness<1?(1-brightness).toFixed(4):"0"}
    function youtubeInfo(value){try{const url=new URL(value),host=url.hostname.replace(/^www\./,"");if(host==="youtu.be")return{video:url.pathname.slice(1),list:url.searchParams.get("list")};if(["youtube.com","m.youtube.com","music.youtube.com"].includes(host)){let video=url.searchParams.get("v");const parts=url.pathname.split("/").filter(Boolean);if(!video&&["embed","shorts"].includes(parts[0]))video=parts[1];return{video,list:url.searchParams.get("list")}}}catch(_){}return null}
    function applyPlayback(){if(source==="youtube"&&ready&&player){const state=player.getPlayerState();if(shouldPlay()){if(state!==YT.PlayerState.PLAYING&&state!==YT.PlayerState.BUFFERING)player.playVideo()}else if(state===YT.PlayerState.PLAYING||state===YT.PlayerState.BUFFERING)player.pauseVideo()}else if(source==="direct"&&direct.src){if(shouldPlay())direct.play().catch(e=>showStatus("Unable to play media: "+e.message));else direct.pause()}}
    function loadMedia(value){wantsPlayback=true;const info=youtubeInfo(value);if(info){direct.pause();showOnly("youtube");if(!ready){pendingUrl=value;showStatus("Loading YouTube player...");return}if(info.list){playlist=info.list;const options={list:playlist,listType:"playlist"};shouldPlay()?player.loadPlaylist(options):player.cuePlaylist(options);log("media","Loaded YouTube playlist URL.")}else if(info.video){playlist="";shouldPlay()?player.loadVideoById(info.video):player.cueVideoById(info.video);log("media","Loaded YouTube video URL.")}else{showStatus("This YouTube URL has no video or playlist.");return}showStatus("");applyPlayback();return}if(ready&&player)player.pauseVideo();playlist="";showOnly("direct");direct.src=value;showStatus("");applyPlayback();log("media","Loaded direct/local media.")}
    function next(step){if(source==="youtube"&&ready){step<0?player.previousVideo():player.nextVideo()}else if(source==="direct"){direct.currentTime=Math.max(0,Math.min(direct.duration||Infinity,direct.currentTime+step*30))}}

    window.onYouTubeIframeAPIReady=()=>{player=new YT.Player("youtube",{width:"100%",height:"100%",playerVars:{autoplay:1,controls:0,disablekb:1,enablejsapi:1,playsinline:1,rel:0},events:{onReady:()=>{ready=true;applyBrightness(brightness);if(pendingUrl){const value=pendingUrl;pendingUrl="";loadMedia(value)}applyPlayback()},onStateChange:event=>{if(vehiclePowered&&!mediaFrozen){if(event.data===YT.PlayerState.PLAYING)wantsPlayback=true;else if(event.data===YT.PlayerState.PAUSED)wantsPlayback=false}if(!shouldPlay()&&(event.data===YT.PlayerState.PLAYING||event.data===YT.PlayerState.BUFFERING))player.pauseVideo()},onError:event=>{log("error","YouTube playback error "+event.data);showStatus("YouTube playback error "+event.data)}}})};
    direct.addEventListener("play",()=>{if(vehiclePowered&&!mediaFrozen)wantsPlayback=true});
    direct.addEventListener("pause",()=>{if(vehiclePowered&&!mediaFrozen)wantsPlayback=false});
    window.prismCommand=payload=>{const separator=payload.indexOf("|"),command=separator<0?payload:payload.slice(0,separator),argument=separator<0?"":payload.slice(separator+1);if(command==="load")loadMedia(argument);else if(command==="playpause"){wantsPlayback=!wantsPlayback;applyPlayback()}else if(command==="play"){wantsPlayback=true;applyPlayback()}else if(command==="pause"){wantsPlayback=false;applyPlayback()}else if(command==="vehiclepower"){vehiclePowered=argument==="1";applyPlayback()}else if(command==="freeze"){mediaFrozen=argument==="1";applyPlayback()}else if(command==="brightness")applyBrightness(argument);else if(command==="next")next(1);else if(command==="previous")next(-1);else if(command==="mute"){if(source==="youtube"&&ready){player.isMuted()?player.unMute():player.mute()}else direct.muted=!direct.muted}else if(command==="volumeup"||command==="volumedown"){const change=command==="volumeup"?5:-5;if(source==="youtube"&&ready)player.setVolume(Math.max(0,Math.min(100,player.getVolume()+change)));else direct.volume=Math.max(0,Math.min(1,direct.volume+change/100))}};
    const api=document.createElement("script");api.src="https://www.youtube.com/iframe_api";document.head.appendChild(api);
  </script>
</body>
</html>
