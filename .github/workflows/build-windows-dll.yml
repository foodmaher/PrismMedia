name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-2022

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify bundled native libraries
        shell: pwsh
        run: |
          $Libraries = @{
              "Lib\ImGuiR.lib" = 7000000
              "Lib\ImGuiD.lib" = 8000000
          }

          foreach ($Entry in $Libraries.GetEnumerator()) {
              if (-not (Test-Path $Entry.Key)) {
                  throw "Required native library is missing: $($Entry.Key)"
              }

              $Size = (Get-Item $Entry.Key).Length
              if ($Size -lt $Entry.Value) {
                  throw "$($Entry.Key) is incomplete ($Size bytes). Replace it from the full source package before building."
              }
          }

      - name: Build plugin
        shell: pwsh
        run: >
          msbuild PrismTextureStreamerFB.sln
          /m
          /restore
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64

      - name: Verify plugin output
        shell: pwsh
        run: |
          $Dll = "x64\Release\PrismTextureStreamerFB.dll"
          $Bridge = "x64\Release\PrismCameraBridge.dll"
          if (-not (Test-Path $Dll)) {
              throw "Expected DLL was not produced: $Dll"
          }
          if (-not (Test-Path $Bridge)) {
              throw "Expected SPF companion was not produced: $Bridge"
          }

          Get-Item $Dll
          Get-FileHash -Algorithm SHA256 $Dll
          Get-Item $Bridge
          Get-FileHash -Algorithm SHA256 $Bridge

      - name: Assemble install package
        shell: pwsh
        run: |
          $Package = "package"
          $Client = "PrismMediaClient\bin\x64\Release\net48"
          if (-not (Test-Path "$Client\PrismMediaClient.exe")) {
              throw "PrismMediaClient.exe was not produced in $Client"
          }

          New-Item -ItemType Directory -Path $Package -Force | Out-Null
          Copy-Item "x64\Release\PrismTextureStreamerFB.dll" $Package
          Copy-Item "$Client\*" $Package -Recurse
          Copy-Item "PERFORMANCE-NOTES.md" $Package
          Copy-Item "V2.3-ADAPTIVE-TESTING.md" $Package
          Copy-Item "V2.4-DISTANCE-AUDIO-TESTING.md" $Package
          Copy-Item "V2.5-REVERSE-PROFILES-TESTING.md" $Package
          Copy-Item "V2.6-INTERNAL-RTT-PROBE.md" $Package
          Copy-Item "V2.7-PARK-ACTIVATION-TEST.md" $Package

          $SpfBridge = "$Package\SPF-OPTIONAL\PrismCameraBridge"
          New-Item -ItemType Directory -Path $SpfBridge -Force |
              Out-Null
          Copy-Item "x64\Release\PrismCameraBridge.dll" $SpfBridge
          Copy-Item "SPF-BRIDGE-INSTALL.txt" "$Package\SPF-OPTIONAL"

          @"
          PrismTextureStreamerFB 2.7.0 Park Activation Test

          Copy the root files and the www folder into:
          <ETS2 or ATS>\bin\win_x64\plugins

          Keep PrismMediaClient.exe and its DLL/files beside
          PrismTextureStreamerFB.dll. Open the menu with Ctrl+F8.

          Do not copy SPF-OPTIONAL as-is. Read its install file only if
          you want exact external-camera distance audio.
          "@ | Set-Content "$Package\INSTALL.txt"

          Get-ChildItem $Package -Recurse

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: PrismTextureStreamerFB-2.7.0-park-activation-test
          path: package
          if-no-files-found: error
          retention-days: 30
