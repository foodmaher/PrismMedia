name: Build PrismMedia
run-name: Build PrismMedia from ${{ github.ref_name }} (#${{ github.run_number }})

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          $Text = Get-Content 'PrismTextureStreamerFB\version.h' -Raw
          if ($Text -notmatch 'g_version\s*=\s*"([^"]+)"') {
            throw 'Could not read g_version from version.h.'
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "PrismMedia version: $($Matches[1])"

      - name: Verify bundled libraries
        shell: pwsh
        run: |
          foreach ($File in @(
            'Lib\ImGuiR.lib',
            'Lib\ImGuiD.lib',
            'Lib\minhook.x64.lib'
          )) {
            if (-not (Test-Path $File)) {
              throw "Missing required library: $File"
            }
          }

      - name: Build x64 Release
        shell: pwsh
        run: >
          msbuild PrismTextureStreamerFB.sln /m /restore /t:Build
          /p:Configuration=Release /p:Platform=x64

      - name: Assemble production package
        shell: pwsh
        run: |
          $Version = '${{ steps.version.outputs.value }}'
          $Package = "package\PrismMedia-$Version"
          $Runtime = "$Package\PrismMedia"
          $Client = 'PrismMediaClient\bin\x64\Release\net48'
          foreach ($File in @(
            'x64\Release\PrismMedia.dll',
            'x64\Release\PrismCameraBridge.dll',
            "$Client\PrismMediaClient.exe"
          )) {
            if (-not (Test-Path $File)) {
              throw "Missing build output: $File"
            }
          }

          New-Item -ItemType Directory -Path $Runtime -Force | Out-Null
          Copy-Item 'x64\Release\PrismMedia.dll' $Package
          Copy-Item "$Client\*" $Runtime -Recurse
          Get-ChildItem $Runtime -Recurse -File |
            Where-Object { $_.Extension -in '.pdb', '.xml' } |
            Remove-Item -Force

          $Bridge = "$Runtime\SPF-OPTIONAL\PrismCameraBridge"
          New-Item -ItemType Directory -Path $Bridge -Force | Out-Null
          Copy-Item 'x64\Release\PrismCameraBridge.dll' $Bridge
          Copy-Item 'SPF-BRIDGE-INSTALL.txt' "$Runtime\SPF-OPTIONAL"
          Copy-Item 'config-recommended.ini' $Runtime
          Copy-Item 'README.md' $Package

          @"
          PrismMedia $Version

          Copy PrismMedia.dll and the PrismMedia folder to:
          <ETS2 or ATS>\bin\win_x64\plugins

          PrismMedia checks local and Steam Workshop TJS mods automatically
          and generates stable Custom display adapters without reading saves.

          Enable "PrismMedia Generated Display" in Mod Manager above the
          original accessory mod, restart once, then configure the matching
          Custom display with Ctrl+F8.
          "@ | Set-Content "$Package\INSTALL.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: PrismMedia-${{ steps.version.outputs.value }}
          path: package/PrismMedia-${{ steps.version.outputs.value }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: PrismMedia-${{ steps.version.outputs.value }}-symbols
          path: x64/Release/PrismMedia.pdb
          if-no-files-found: error
          retention-days: 14

