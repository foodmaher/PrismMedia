name: Build Windows 4.0.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate runtime diagnostic host
        shell: powershell
        run: |
          cl /nologo /EHsc /std:c++17 tests\diagnostic_options_test.cpp /Fe:diagnostic-options-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Options test compilation failed' }
          & .\diagnostic-options-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Options tests failed' }
          cl /nologo /EHsc /std:c++17 tests\runtime_draw_probe_test.cpp PrismTextureStreamerFB\runtime_draw_probe.cpp /Fe:runtime-draw-test.exe /link d3d11.lib
          if ($LASTEXITCODE -ne 0) { throw 'WARP capture test compilation failed' }
          $json = & .\runtime-draw-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'WARP capture tests failed' }
          $row = $json | ConvertFrom-Json
          if ($row.texture.width -ne 64 -or $row.hits -ne 2 -or $row.psSrvs.Count -ne 128) { throw 'Invalid capture JSON' }
          & .\tests\diagnostic_scripts_test.ps1
      - name: Verify bundled libraries
        shell: pwsh
        run: |
          foreach ($File in @('Lib\ImGuiR.lib','Lib\ImGuiD.lib','Lib\minhook.x64.lib')) {
            if (-not (Test-Path $File)) { throw "Missing required library: $File" }
          }
      - name: Build x64 Release
        shell: pwsh
        run: msbuild PrismTextureStreamerFB.sln /m /restore /t:Build /p:Configuration=Release /p:Platform=x64
      - name: Assemble 4.0.0 package
        shell: pwsh
        run: |
          $Package = 'package'
          $Runtime = "$Package\PrismMedia"
          $Client = 'PrismMediaClient\bin\x64\Release\net48'
          foreach ($File in @('x64\Release\PrismMedia.dll','x64\Release\PrismCameraBridge.dll','x64\Release\PrismDiagnosticConsole.exe',"$Client\PrismMediaClient.exe")) {
            if (-not (Test-Path $File)) { throw "Missing build output: $File" }
          }
          New-Item -ItemType Directory -Path $Runtime -Force | Out-Null
          Copy-Item 'x64\Release\PrismMedia.dll' $Package
          Copy-Item 'x64\Release\PrismDiagnosticConsole.exe' $Package
          Copy-Item 'diagnostics' $Package -Recurse
          Copy-Item "$Client\*" $Runtime -Recurse
          Get-ChildItem $Runtime -Recurse -File | Where-Object { $_.Extension -in '.pdb','.xml' } | Remove-Item -Force
          $Bridge = "$Runtime\SPF-OPTIONAL\PrismCameraBridge"
          New-Item -ItemType Directory -Path $Bridge -Force | Out-Null
          Copy-Item 'x64\Release\PrismCameraBridge.dll' $Bridge
          Copy-Item 'SPF-BRIDGE-INSTALL.txt' "$Runtime\SPF-OPTIONAL"
          Copy-Item 'config-recommended.ini' $Runtime
          Copy-Item 'PERFORMANCE-NOTES.md' $Runtime
          Copy-Item 'README.md' $Package
          Copy-Item 'DIAGNOSTIC-CONSOLE.md' $Package
          @"
          PrismMedia 4.0.0
          Remove the old PrismTextureStreamerFB.dll, then copy PrismMedia.dll
          and the PrismMedia folder to:
          <ETS2 or ATS>\bin\win_x64\plugins
          Open the UI with Ctrl+F8.

          PrismDiagnosticConsole.exe is optional. Start the game first, then
          run the console. Keep its diagnostics folder beside the EXE.
          Enter: route status
          Per-display routing is automatic for one enabled custom display.
          See DIAGNOSTIC-CONSOLE.md for recovery and capture instructions.
          "@ | Set-Content "$Package\INSTALL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PrismMedia-4.0.0
          path: package
          if-no-files-found: error
          retention-days: 30
